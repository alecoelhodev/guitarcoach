services:
  api:
    build:
      target: development
    environment:
      NODE_ENV: development
      START_COMMAND: npm run start:dev
      # Overrides the host-path value of GOOGLE_APPLICATION_CREDENTIALS from
      # compose.yaml — the container can't see host paths directly, so it
      # must point at the in-container path the volume below mounts to.
      GOOGLE_APPLICATION_CREDENTIALS: /usr/src/app/gcp-credentials.json
    ports:
      - "${PORT:-3000}:3000"
    volumes:
      # Falls back to /dev/null (a harmless, always-valid bind-mount source)
      # when GCP_CREDENTIALS_HOST_PATH isn't set, so the container still
      # boots for anyone not exercising the recordings feature locally.
      - ${GCP_CREDENTIALS_HOST_PATH:-/dev/null}:/usr/src/app/gcp-credentials.json:ro
    develop:
      watch:
        - action: sync
          path: ./src
          target: /usr/src/app/src
        - action: sync
          path: ./test
          target: /usr/src/app/test
        - action: sync
          path: ./nest-cli.json
          target: /usr/src/app/nest-cli.json
        - action: sync
          path: ./tsconfig.json
          target: /usr/src/app/tsconfig.json
        - action: sync
          path: ./tsconfig.build.json
          target: /usr/src/app/tsconfig.build.json
        - action: rebuild
          path: ./package.json
        - action: rebuild
          path: ./package-lock.json

  postgres:
    ports:
      - "${POSTGRES_PORT:-5432}:5432"

  redis:
    ports:
      - "${REDIS_PORT:-6379}:6379"

  rabbitmq:
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
