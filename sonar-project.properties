# SonarQube Cloud analysis config. Auto-discovered by the scanner from the repo
# root; the same file drives .github/workflows/code-quality.yml and any local
# scanner run. See docs/code-quality.md.
#
# Both keys below are assigned by SonarQube Cloud at project import and must
# match it exactly -- a mismatch fails the scan with "project not found".
# These are confirmed against the imported project, not guessed.
sonar.projectKey=alecoelhodev_guitarcoach
sonar.organization=alecoelhodev

# sonar.host.url is deliberately absent: it is required for a self-hosted
# SonarQube Server, never for SonarQube Cloud.

sonar.sources=src
sonar.tests=src,test
sonar.test.inclusions=src/**/*.spec.ts,test/**/*.ts

# A file must be either source or test, never both, or the scan aborts with
# "File can't be indexed twice" -- so the specs that sonar.tests claims above
# have to be subtracted from sonar.sources here as well.
#
# src/generated is the Prisma client. It is gitignored (Sonar honours SCM
# ignores) but `prisma generate` materialises it in the workspace before the
# scan runs, and Sonar indexes the working tree, so it is excluded explicitly.
# Left in, its ~19k generated lines would dominate every ratio in the project.
sonar.exclusions=src/generated/**,src/**/*.spec.ts

# Written by `npm run test:cov`. Paths inside the report are relative to the
# repo root, which is where the scanner resolves them from -- do not add a
# `working-directory:` to the test step, that would break the prefix silently
# and show every file as 0% covered.
sonar.javascript.lcov.reportPaths=coverage/lcov.info

sonar.sourceEncoding=UTF-8

# Report-only, deliberately. Without sonar.qualitygate.wait the scanner uploads
# results and exits 0, so a failing gate never turns the workflow red. To make
# the gate blocking once the numbers have settled, uncomment:
# sonar.qualitygate.wait=true
