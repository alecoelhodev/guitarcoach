# Secret scanning over the full git history with Betterleaks.
#
# Deliberately a separate, independent workflow (no `needs:` on ci.yml's
# build-and-test job) so it runs in parallel with the existing PR checks
# instead of lengthening that pipeline — same rationale as k6-performance.yml.
#
# Unlike ci.yml this also runs on push to main, so a commit landing without a
# PR is still scanned. It runs the same pinned binary, the same
# .betterleaks.toml and the same baseline as the local pre-commit hook, so a
# commit can never pass locally and fail here (or vice versa).
#
# No secrets, no account, no license key: betterleaks is MIT and the binary is
# fetched from its GitHub release and checksum-verified by the install script.
name: Security

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: read
      # Required to publish the SARIF report to the repository's Security tab.
      security-events: write

    steps:
      - name: Check out repository code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          # Full history: the scan walks every commit, not just the tip.
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'

      - name: Install Betterleaks
        # The install script no-ops under CI unless explicitly forced, so that
        # every other workflow's `npm ci` does not download a scanner it will
        # never run.
        env:
          BETTERLEAKS_FORCE_INSTALL: '1'
        run: node scripts/install-betterleaks.mjs

      - name: Scan git history for secrets
        run: |
          .tooling/bin/betterleaks git . \
            --redact \
            --no-banner \
            --baseline-path .betterleaks-baseline.json \
            --report-format sarif \
            --report-path results.sarif

      - name: Upload results to code scanning
        # Publish findings even when the scan failed — that is exactly when the
        # SARIF report is worth reading.
        if: always()
        uses: github/codeql-action/upload-sarif@1190a975f95ce23525efb6a3fc21ea29567c1b52 # v3.38.2
        with:
          sarif_file: results.sarif
