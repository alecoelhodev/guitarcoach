name: CI

on:
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository code
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Run unit tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Generate OpenAPI schema and check it's committed
        run: npm run openapi:check
        env:
          NODE_ENV: test
          PORT: '3000'
          API_PREFIX: api
          API_VERSION: v1
          DATABASE_URL: postgres://user:pass@localhost:5432/db
          BETTER_AUTH_SECRET: ci-placeholder-secret-at-least-32-chars-long
          BETTER_AUTH_URL: http://localhost:3000
          CORS_ORIGINS: http://localhost:8081
          REDIS_URL: redis://localhost:6379
          RABBITMQ_URL: amqp://localhost:5672
          GCP_PROJECT_ID: ci-placeholder
          GCS_RECORDINGS_BUCKET: ci-placeholder
          OPENAI_API_KEY: ci-placeholder
          OPENAI_MODEL: gpt-4o-mini
          LOG_LEVEL: error
          METRICS_EXPORT_ENABLED: 'false'
