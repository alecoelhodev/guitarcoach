# Named `api` to match the spec's own port-forward example
# (`kubectl port-forward service/api 3000:3000`) and so DATABASE_URL-style
# hostnames elsewhere in this app's config stay predictable.
apiVersion: v1
kind: Service
metadata:
  name: api
  labels:
    app.kubernetes.io/name: api
    app.kubernetes.io/part-of: guitar-coach
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: api
  ports:
    - name: http
      port: 3000
      targetPort: http
